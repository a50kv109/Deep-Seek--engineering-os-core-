name: Close stale issues and PRs

on:
  schedule:
    - cron: "30 1 * * *"
  workflow_dispatch:

permissions:
  issues: write
  pull-requests: write

jobs:
  stale:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/stale@v9
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}
          days-before-stale: 30
          days-before-close: 7
          stale-issue-label: stale
          stale-pr-label: stale
          exempt-issue-labels: security,critical,pinned,help wanted
          exempt-pr-labels: security,critical,pinned
          stale-issue-message: |
            Эта задача помечена как stale. Если актуальна — оставьте комментарий. Будет закрыта через 7 дней.
          close-issue-message: |
            Закрыто автоматически.
          stale-pr-message: |
            Этот PR помечен как stale. Если актуален — оставьте комментарий.
          close-pr-message: |
            PR закрыт автоматически.
